<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Information</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(to bottom, #006400, #228B22);
      margin: 0;
      padding: 0;
    }

    .form-container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      border-top: 8px solid #FFD700;
    }

    h1 {
      text-align: center;
      color: #FFD700;
      margin-bottom: 5px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #006400;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ebbe0b;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #c7b136;
      box-shadow: 0 0 6px rgba(0,0,0,0.2);
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #FFD700;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #006400;
      color: #ffffff;
    }

    footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #006400;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h1>DRIVER INFORMATION</h1>
    <div class="subtitle">ESSU Campus Transportation System</div>

    <form action="next.html" method="get">

      <label>First Name</label>
      <input type="text" name="firstName" required>

      <label>Last Name</label>
      <input type="text" name="lastName" required>

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Date of Birth</label>
      <input type="date" name="dob" required>

      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Address</label>
      <input type="text" name="address" required>

      <label>Mobile Number</label>
      <input type="tel" name="mobile" required>

      <label>Driver’s License Number</label>
      <input type="text" name="licenseNumber" required>

      <label>License Expiration Date</label>
      <input type="date" name="licenseExpiry" required>

      <label>Vehicle Type</label>
      <select name="vehicleType" required>
        <option>Motorcycle</option>
        <option>Tricycle</option>
      </select>

      <label>Vehicle Plate Number</label>
      <input type="text" name="plateNumber" required>

      <label>Years of Driving Experience</label>
      <input type="number" name="experience" min="0" required>

      <label>Emergency Contact</label>
      <input type="text" name="emergencyContact" required>

      <a href="next.html"><button type="submit">Next</button></a>

    </form>

    <footer>
      © ESSU Transportation System
    </footer>
  </div>

</body>
</html>
