<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChaRide Admin - Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }

    body {
        /* Animated green + white gradient background */
        background: linear-gradient(-45deg, #28a745, #66bb6a, #a5d6a7, #ffffff);
        background-size: 400% 400%;
        animation: gradientBG 8s ease infinite;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #333;
        text-align: center;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .logo {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
        background-image: url('logo.png'); /* Replace with your logo path */
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        border-radius: 50%;
        box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }

    h1 {
        color: #28a745;
        font-size: 36px;
        margin-bottom: 15px;
        text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
    }

    p {
        color: #333;
        font-size: 18px;
        max-width: 600px;
        margin-bottom: 40px;
        text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
    }

    .btn {
        background-color: #28a745;
        color: #fff;
        padding: 15px 35px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        transition: 0.3s;
    }

    .btn:hover {
        background-color: #218838;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    footer {
        margin-top: 50px;
        color: #333;
        opacity: 0.8;
        text-align: center;
    }
</style>
</head>
<body>

<div class="logo"></div>

<h1>Welcome to ChaRide Admin</h1>
<p>As an admin, you can manage rides, monitor users, view reports, and ensure the platform runs smoothly.</p>

<a href="login.html" class="btn">Sign In</a>

<footer>
    &copy; 2026 ChaRide. All rights reserved.
</footer>

</body>
</html>
