<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESAKAY | Login</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* same animated gradient theme */
  background: linear-gradient(-45deg, #2e7d32, #66bb6a, #a5d6a7, #ffffff);
  background-size: 400% 400%;
  animation: gradientBG 8s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.login-card {
  width: 360px;
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  text-align: center;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  width: 100px;
  height: 100px;
  margin: auto;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h2 {
  color: #2e7d32;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 13px;
  color: #777;
  margin-bottom: 25px;
}

.input-group {
  text-align: left;
  margin-bottom: 15px;
}

.input-group label {
  font-size: 13px;
  color: #555;
}

.input-group input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #2e7d32;
  box-shadow: 0 0 8px rgba(46,125,50,0.3);
}

.login-btn {
  display: block;
  width: 100%;
  background: #2e7d32;
  color: white;
  border: none;
  padding: 14px;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.3s;
  text-align: center;
  text-decoration: none;
}

.login-btn:hover {
  background: #256628;
  box-shadow: 0 0 15px rgba(46,125,50,0.6);
}

.extra {
  margin-top: 15px;
  font-size: 13px;
}

.extra a {
  color: #2e7d32;
  text-decoration: none;
  font-weight: bold;
}

.extra a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo">
    <img src="esakay.png" alt="ESAKAY Logo">
  </div>

  <h2>Welcome Back</h2>
  <div class="subtitle">Login to Cha Ride</div>

  <form>
    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password" required>
    </div>

    <a href="dashboard-driver.html" class="login-btn">Login</a>
  </form>

  <div class="extra">
    Don’t have an account? <a href="signup.html">Sign Up</a>
    
  </div>

</div>

</body>
</html>
