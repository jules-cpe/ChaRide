<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cha Ride | Sign Up</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(-45deg, #2e7d32, #66bb6a, #a5d6a7, #ffffff);
  background-size: 400% 400%;
  animation: gradientBG 8s ease infinite;
}

@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.signup-card {
  width: 380px;
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  margin-bottom: 15px;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h2 {
  text-align: center;
  color: #2e7d32;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: #777;
  margin-bottom: 20px;
}

.input-group {
  margin-bottom: 14px;
}

.input-group label {
  font-size: 13px;
  color: #555;
}

.input-group input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 10px;
  border: 1px solid #ccc;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: #2e7d32;
  box-shadow: 0 0 8px rgba(46,125,50,0.3);
}

.signup-btn {
  display: block;
  width: 100%;
  background: #2e7d32;
  color: white;
  border: none;
  padding: 14px;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.3s;
  text-align: center;
  text-decoration: none;
}

.signup-btn:hover {
  background: #256628;
  box-shadow: 0 0 15px rgba(46,125,50,0.6);
}


.extra {
  text-align: center;
  margin-top: 15px;
  font-size: 13px;
}

.extra a {
  color: #2e7d32;
  font-weight: bold;
  text-decoration: none;
}

.extra a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="signup-card">

  <div class="logo">
    <img src="logo.png" alt="Cha Ride Logo">
  </div>

  <h2>Create Account</h2>
  <div class="subtitle">Join Cha Ride Today</div>

  <form>
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Create a password" required>
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm your password" required>
    </div>

  <a href="dashboard-driver.html" class="signup-btn">Sign Up</a>

  </form>

  <div class="extra">
    Already have an account? <a href="login.html">Login</a>
  </div>

</div>

</body>
</html>
