<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Login & Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      background: #c7f2df; /* light mint green */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #ffffff;
      width: 360px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      padding: 30px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 { margin-bottom: 20px; color: #2f8f6f; }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }
    input:focus { border-color: #2f8f6f; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2f8f6f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #256f56; }
    .toggle { margin-top: 20px; color: #555; font-size: 14px; }
    .toggle span { color: #2f8f6f; cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>

<body>

  <div class="container">
    <h2 id="title">Driver Login</h2>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signupForm" class="hidden">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="text" placeholder="Phone Number" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <span onclick="toggleForm()"> Sign Up</span>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const title = document.getElementById('title');
    const toggleText = document.getElementById('toggleText');

    function toggleForm() {
      loginForm.classList.toggle('hidden');
      signupForm.classList.toggle('hidden');

      if (loginForm.classList.contains('hidden')) {
        title.textContent = "Driver Sign Up";
        toggleText.textContent = "Already have an account?";
      } else {
        title.textContent = "Driver Login";
        toggleText.textContent = "Don't have an account?";
      }
    }

    // Redirect to dashboard after login
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      // Replace alert with redirect
      window.location.href = "dashboard-driver.html";
    });

    // Redirect to dashboard after sign up
    signupForm.addEventListener('submit', e => {
      e.preventDefault();
      window.location.href = "Driver-inf.html";
    });
  </script>

</body>
</html>
