<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Driver</title>
  <link rel="icon" href="logo.png" type="image/png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --bg: #16a34a;
      --card: #15803d;
      --text: #fef3c7;
      --muted: #fcd34d;
      --accent: #fbbf24;
      --success: #dcfce7;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f5c2e 0%, #0a3d1f 100%);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    .title {
      margin-bottom: 24px;
      font-size: 28px;
      font-weight: 700;
    }

    /* Container for map + details */
    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    /* Left side container for back button + map */
    .map-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 2;
      min-width: 400px;
    }

    /* Back button */
    .back-btn {
      align-self: flex-start;
      padding: 10px 16px;
      background: var(--accent);
      color: #0a3d1f;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      opacity: 0.8;
      transform: translateX(-4px);
    }

    /* Map container */
    .map-container {
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(251,191,36,0.2);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Driver details card */
    .details-card {
      flex: 1;
      background: rgba(20, 83, 45, 0.85);
      padding: 24px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(251,191,36,0.1);
    }

    .details-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: var(--accent);
      font-size: 20px;
    }

    /* Profile image */
    .profile-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      margin-bottom: 10px;
    }

    /* Custom upload button */
    .upload-btn {
      padding: 8px 16px;
      background: var(--accent);
      color: #0a3d1f;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .upload-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .row {
      margin-bottom: 14px;
    }

    .row span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .row strong {
      font-size: 15px;
      color: var(--text);
    }

    /* Call button */
    .call-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #0a3d1f;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: all 0.2s ease;
    }

    .call-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .container {
        flex-direction: column;
      }

      .map-wrapper {
        min-width: 100%;
      }

      .map-container {
        height: 300px;
      }

      .details-card {
        width: 100%;
      }

      .back-btn {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

  <h1 class="title">Track Driver</h1>

  <div class="container">

    <!-- Left side: Back button + Map -->
    <div class="map-wrapper">
      <button class="back-btn" onclick="history.back()">← Back</button>

      <div class="map-container">
        <iframe
          src="https://maps.google.com/maps?q=11.600000,125.433333&z=14&output=embed"
          allowfullscreen
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </div>

    <!-- Driver Details -->
    <div class="details-card">
      <h2>Driver Details</h2>

      <!-- Profile Image with hidden file input -->
      <div class="profile-wrapper">
        <img id="driverImg" src="https://via.placeholder.com/100" alt="Driver Profile" class="profile-img">
        <input type="file" id="imgUpload" accept="image/*" style="display: none;">
        <button class="upload-btn" id="uploadBtn">Change Photo</button>
      </div>

      <div class="row">
        <span>Driver Name</span>
        <strong>Juan Dela Cruz</strong>
      </div>

      <div class="row">
        <span>Vehicle</span>
        <strong>Tricycle – ABC 1234</strong>
      </div>

      <div class="row">
        <span>Current Location</span>
        <strong>Borongan City, Eastern Samar</strong>
      </div>

      <div class="row">
        <span>Distance Away</span>
        <strong>2.5 km</strong>
      </div>

      <div class="row">
        <span>Estimated Arrival</span>
        <strong>8 minutes</strong>
      </div>

      <button class="call-btn">📞 Call Driver</button>
    </div>

  </div>

  <script>
    const imgUpload = document.getElementById('imgUpload');
    const driverImg = document.getElementById('driverImg');
    const uploadBtn = document.getElementById('uploadBtn');

    // Open hidden file input when button is clicked
    uploadBtn.addEventListener('click', () => {
      imgUpload.click();
    });

    // Update profile image preview
    imgUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          driverImg.src = reader.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
