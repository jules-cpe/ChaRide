<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Login</title>

<style>
*{
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d976c,#93f9b9);
}

/* LOGIN CARD */
.login-box{
    width:380px;
    padding:40px 30px;
    border-radius:25px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(18px);
    box-shadow:0 25px 45px rgba(0,0,0,0.25);
    text-align:center;
    animation:slide 0.8s ease;
}

@keyframes slide{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

/* BIG LOGO */
.logo img{
    width:160px;
    height:auto;
    margin-bottom:25px;
}

/* TITLE */
.login-box h2{
    margin:0 0 8px;
    color:#0e4f3a;
    font-size:24px;
    font-weight:600;
}

.login-box p{
    margin-bottom:22px;
    font-size:14px;
    color:#1f6f54;
}

/* INPUTS */
input{
    width:100%;
    padding:14px 16px;
    margin-bottom:15px;
    border-radius:14px;
    border:none;
    outline:none;
    font-size:14px;
    background:rgba(255,255,255,0.95);
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    margin-top:5px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#0f9b6c,#057a55);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

/* SIGN UP LINK */
.signup{
    margin-top:18px;
    font-size:14px;
    color:#0e4f3a;
}

.signup a{
    color:#057a55;
    font-weight:600;
    text-decoration:none;
}

.signup a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="login-box">

    <!-- LOGO -->
    <div class="logo">
        <img src="c:\Users\crizel mae bula\Downloads\622460261_791108824002514_6532430894315629784_n (1).png" alt="Logo">
    </div>

    <h2>Driver Login</h2>
    <p>Please sign in to continue</p>

    <form onsubmit="login(event)">
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">LOGIN</button>
    </form>

    <!-- SIGN UP TEXT -->
    <div class="signup">
        You don’t have an account?
        <a href="signup-driver.html">Sign up</a>
    </div>

</div>

<script>
function login(e){
    e.preventDefault();
    window.location.href="dashboard-driver.html";
}
</script>

</body>
</html>
