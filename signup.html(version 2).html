<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Sign Up</title>

<style>
*{
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d976c,#93f9b9);
}

.signup-box{
    width:480px;
    max-width:95%;
    padding:40px 30px;
    border-radius:25px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(18px);
    box-shadow:0 25px 45px rgba(0,0,0,0.25);
    text-align:center;
    animation:slide 0.8s ease;
}

@keyframes slide{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

.logo img{
    width:120px;
    height:auto;
    margin-bottom:15px;
}

.signup-box h2{
    margin:0 0 8px;
    color:#0e4f3a;
    font-size:24px;
    font-weight:600;
}

.signup-box p{
    margin-bottom:20px;
    font-size:14px;
    color:#1f6f54;
}

input, select{
    width:100%;
    padding:12px 16px;
    margin-bottom:12px;
    border-radius:14px;
    border:none;
    outline:none;
    font-size:14px;
    background:rgba(255,255,255,0.95);
}

textarea{
    width:100%;
    padding:12px 16px;
    border-radius:14px;
    border:none;
    outline:none;
    font-size:14px;
    background:rgba(255,255,255,0.95);
    margin-bottom:12px;
    resize:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:5px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#0f9b6c,#057a55);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

.login-link{
    margin-top:18px;
    font-size:14px;
    color:#0e4f3a;
}

.login-link a{
    color:#057a55;
    font-weight:600;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
}

.profile-pic-preview{
    width:100px;
    height:100px;
    margin:0 auto 10px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:2px solid #057a55;
}
</style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        <img src="c:\Users\crizel mae bula\Downloads\622460261_791108824002514_6532430894315629784_n (1).png" alt="Logo">
    </div>

    <h2>Create Account</h2>
    <p>Sign up to join as a driver</p>

    <form id="signupForm" onsubmit="signup(event)" enctype="multipart/form-data">

        <!-- PROFILE PICTURE -->
        <img id="profilePreview" class="profile-pic-preview" src="" alt="Profile Preview" style="display:none;">
        <input type="file" id="profilePic" accept="image/*" required onchange="previewProfilePic(event)">

        <!-- PERSONAL INFO -->
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="username" placeholder="Username" required>
        <input type="date" id="dob" placeholder="Date of Birth" required>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="mobile" placeholder="Mobile Number" required>

        <!-- DRIVER LICENSE -->
        <input type="text" id="licenseId" placeholder="Driver License ID" required>
        <input type="file" id="licensePic" accept="image/*,.pdf" required placeholder="Upload Driver License">

        <!-- VEHICLE INFO -->
        <input type="text" id="vehicleType" placeholder="Vehicle Type" required>
        <input type="text" id="plateNumber" placeholder="Vehicle Plate Number" required>
        <input type="number" id="experience" placeholder="Years of Driving Experience" required>

        <!-- EMERGENCY CONTACT -->
        <input type="text" id="emergencyName" placeholder="Emergency Contact Name" required>
        <input type="text" id="emergencyNumber" placeholder="Emergency Contact Number" required>

        <button type="submit">SIGN UP</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="login-driver.html">Login</a>
    </div>

</div>

<script>
function previewProfilePic(event){
    const reader = new FileReader();
    reader.onload = function(){
        const output = document.getElementById('profilePreview');
        output.src = reader.result;
        output.style.display = 'block';
    };
    reader.readAsDataURL(event.target.files[0]);
}

function signup(e){
    e.preventDefault();

    const profilePic = document.getElementById('profilePic').files[0];

    const personalInfo = {
        profilePic: profilePic,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        username: document.getElementById('username').value,
        dob: document.getElementById('dob').value,
        gender: document.getElementById('gender').value,
        address: document.getElementById('address').value,
        mobile: document.getElementById('mobile').value
    };

    const driverLicense = {
        licenseId: document.getElementById('licenseId').value,
        licensePic: document.getElementById('licensePic').files[0]
    };

    const vehicleInfo = {
        vehicleType: document.getElementById('vehicleType').value,
        plateNumber: document.getElementById('plateNumber').value,
        experience: document.getElementById('experience').value
    };

    const emergencyContact = {
        name: document.getElementById('emergencyName').value,
        number: document.getElementById('emergencyNumber').value
    };

    console.log("Personal Info:", personalInfo);
    console.log("Driver License:", driverLicense);
    console.log("Vehicle Info:", vehicleInfo);
    console.log("Emergency Contact:", emergencyContact);

    alert("Account created successfully! Please login.");
    window.location.href = "login-driver.html";
}
</script>

</body>
</html>
